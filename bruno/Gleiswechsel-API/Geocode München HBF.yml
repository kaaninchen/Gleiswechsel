info:
  name: Geocode München HBF
  type: http
  seq: 1

http:
  method: GET
  url: https://api.transitous.org/api/v1/geocode?text=München Hbf
  headers:
    - name: User-Agent
      value: Gleiswechsel-Discord-Bot
  params:
    - name: text
      value: München Hbf
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setEnvVar("stop_id", data[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
