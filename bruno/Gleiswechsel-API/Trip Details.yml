info:
  name: Trip Details
  type: http
  seq: 4

http:
  method: GET
  url: https://api.transitous.org/api/v2/trip?tripId={{trip_id}}
  headers:
    - name: User-Agent
      value: Gleiswechsel-Discord-Bot
  params:
    - name: tripId
      value: "{{trip_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
