info:
  name: Stoptimes for Station
  type: http
  seq: 3

http:
  method: GET
  url: https://api.transitous.org/api/v1/stoptimes?stopId={{stop_id}}&n=10
  headers:
    - name: User-Agent
      value: Gleiswechsel-Discord-Bot
  params:
    - name: stopId
      value: "{{stop_id}}"
      type: query
    - name: n
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setEnvVar("trip_id", data.stopTimes[0].tripId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
